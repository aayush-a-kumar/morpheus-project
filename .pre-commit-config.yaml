default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3.11
exclude: ^\.  # ignore hidden directories such as .ci, .gitlab, .venv
repos:
  - repo: local  # set up all as local to manage packages with pip/uv
    hooks:
      # ################################################################################
      # Static analysis before committing
      # ################################################################################

      - id: ruff-linter
        name: Linter [ruff]
        description: "Run 'ruff check' for extremely fast Python linting"
        entry: ruff check --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-format
        name: Formatter [ruff]
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: ruff format --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]

      - id: typos
        name: Spell checker [typos]
        description: "Finds and corrects spelling mistakes among source code"
        entry: typos --config pyproject.toml
        language: python
        types: [text]
        pass_filenames: true
        stages: [pre-commit]

      - id: vulture
        name: Static code analyzer [vulture]
        description: "Run 'vulture src' to check for any dead/unused code"
        entry: vulture src --min-confidence=100
        language: python
        types: [python]
        require_serial: true
        pass_filenames: false
        stages: [pre-commit]

      - id: mdformat
        name: Markdown formatter [mdformat]
        description: "Opinionated formatter to enforce a consistent style in Markdown files"
        entry: mdformat
        language: python
        exclude: |
          (?x)(
            ^examples/|
            ^THIRD_PARTY_LICENSES.md$
          )
        types: [markdown]
        stages: [pre-commit]

      - id: commitizen
        name: commitizen check
        description: >
          Check whether the current commit message follows committing rules.
        entry: cz check --allow-abort --commit-msg-file
        language: python
        stages: [commit-msg]